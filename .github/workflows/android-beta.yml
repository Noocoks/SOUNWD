name: SOUNWD Android Beta

on:
  push:
    branches: [beta/android-minimal-screen]
    paths:
      - 'app/**'
      - 'icon/**'
      - 'tools/**'
      - '.github/workflows/android-beta.yml'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
  pull_request:
    paths:
      - 'app/**'
      - 'icon/**'
      - 'tools/**'
      - '.github/workflows/android-beta.yml'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-beta-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install icon generator dependency and audit tool
        run: python -m pip install --upgrade Pillow pip-audit 'setuptools>=84.1.0'

      - name: Audit Python build dependencies
        run: pip-audit --strict

      - name: Test icon generator
        run: python -m unittest discover -s tools -p 'test_*.py' -v

      - name: Verify Android manifest security
        run: python tools/test_android_manifest_security.py

      - name: Generate and install Android icons
        shell: bash
        run: |
          set -euo pipefail
          python tools/generate_icons.py
          RES=app/src/main/res
          mkdir -p "$RES/drawable" "$RES/drawable-nodpi" "$RES/mipmap-anydpi" "$RES/values"
          cp assets/generated/android/drawable-nodpi/sounwd_master.png "$RES/drawable-nodpi/"
          cp assets/generated/android/drawable/sounwd_mark.png "$RES/drawable/"
          cp assets/generated/android/drawable/sounwd_launcher_foreground.png "$RES/drawable/"
          cp assets/generated/android/mipmap-anydpi/ic_launcher.xml "$RES/mipmap-anydpi-v26/"
          # The app targets Android 10+, so the adaptive icon needs no v26 qualifier.
          rm -f "$RES/mipmap-anydpi-v26/ic_launcher.xml"
          rm -f "$RES/mipmap-anydpi/ic_launcher.xml"
          rm -f "$RES/drawable/sounwd_mark.xml"
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "$RES/mipmap-$density"
            cp "assets/generated/android/mipmap-$density/ic_launcher.png" "$RES/mipmap-$density/"
          done
          test -s "$RES/drawable/sounwd_mark.png"
          test -s "$RES/mipmap-mdpi/ic_launcher.png"
          test -s "$RES/mipmap-xxxhdpi/ic_launcher.png"

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4.4.3
        with:
          gradle-version: '8.11.1'

      - name: Run Android Lint and unit tests
        run: gradle --no-daemon lintDebug testDebugUnitTest

      - name: Build Android debug and release APKs
        run: gradle --no-daemon assembleDebug assembleRelease

      - name: Verify release manifest does not enable debugging or cleartext
        run: python tools/check_android_release_manifest.py

      - name: Verify APK was generated
        run: test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sounwd-beta-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
