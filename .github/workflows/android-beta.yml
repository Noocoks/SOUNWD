name: SOUNWD Android Beta

on:
  push:
    branches: [beta/android-minimal-screen]
    paths:
      - 'app/**'
      - 'icon/**'
      - 'tools/generate_icons.py'
      - '.github/workflows/android-beta.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'icon/**'
      - 'tools/generate_icons.py'
      - '.github/workflows/android-beta.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install icon generator dependency
        run: python -m pip install Pillow
      - name: Generate and install Android icons
        shell: bash
        run: |
          set -euo pipefail
          python tools/generate_icons.py
          RES=app/src/main/res
          mkdir -p "$RES/drawable" "$RES/drawable-nodpi" "$RES/mipmap-anydpi-v26"
          cp assets/generated/android/drawable-nodpi/sounwd_master.png "$RES/drawable-nodpi/"
          cp assets/generated/android/drawable/sounwd_mark.png "$RES/drawable/"
          cp assets/generated/android/drawable/sounwd_launcher_foreground.png "$RES/drawable/"
          cp assets/generated/android/mipmap-anydpi-v26/ic_launcher.xml "$RES/mipmap-anydpi-v26/"
          rm -f "$RES/drawable/sounwd_mark.xml"
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "$RES/mipmap-$density"
            cp "assets/generated/android/mipmap-$density/ic_launcher.png" "$RES/mipmap-$density/"
          done
          test -s "$RES/drawable/sounwd_mark.png"
          test -s "$RES/drawable/sounwd_launcher_foreground.png"
          grep -q '@drawable/sounwd_launcher_foreground' "$RES/mipmap-anydpi-v26/ic_launcher.xml"
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build Android debug APK
        run: gradle assembleDebug
      - name: Verify APK was generated
        run: test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Install Android emulator image
        run: |
          sdkmanager --install "system-images;android-35;google_apis;x86_64" "platform-tools" "emulator"
      - name: Launch APK in Android emulator
        shell: bash
        run: |
          set -euo pipefail
          echo "no" | avdmanager create avd --name sounwd-api35 --package "system-images;android-35;google_apis;x86_64" --device pixel_2 --force
          emulator -avd sounwd-api35 -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect > /tmp/sounwd-emulator.log 2>&1 &
          adb wait-for-device
          for attempt in $(seq 1 120); do
            if [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then
              break
            fi
            sleep 2
          done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1"
          adb install -r app/build/outputs/apk/debug/app-debug.apk
          adb shell am force-stop com.sounwd.beta
          adb shell am start -W -n com.sounwd.beta/.MainActivity
          sleep 5
          adb shell dumpsys activity activities | grep -F "com.sounwd.beta/.MainActivity"
          adb shell uiautomator dump /sdcard/sounwd-window.xml >/dev/null
          adb pull /sdcard/sounwd-window.xml sounwd-window.xml >/dev/null
          grep -q "SOUNWD se ha abierto" sounwd-window.xml
          if adb logcat -d -s AndroidRuntime:E | grep -q "FATAL EXCEPTION"; then
            adb logcat -d -s AndroidRuntime:E
            exit 1
          fi
      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: sounwd-beta-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
