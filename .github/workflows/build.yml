name: Build SOUNWD desktop apps

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "src/**"
      - "requirements.txt"
      - "bootstrap.py"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: SOUNWD-Windows
            output: SOUNWD.exe
          - os: ubuntu-22.04
            artifact: SOUNWD-Linux
            output: SOUNWD

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate desktop Python syntax
        run: python -m py_compile src/gui.py src/cli.py bootstrap.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build standalone app
        run: pyinstaller --noconfirm --clean --onefile --windowed --name SOUNWD --collect-all customtkinter --collect-all imageio_ffmpeg --collect-all yt_dlp src/gui.py

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.output }}
          if-no-files-found: error
