name: SOUNWD Android Beta

on:
  push:
    branches: [beta/android-minimal-screen, 'security/**']
    paths:
      - 'beta-android/**'
      - '.github/workflows/android-beta.yml'
  pull_request:
    paths:
      - 'beta-android/**'
      - '.github/workflows/android-beta.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    defaults:
      run:
        working-directory: beta-android
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: sounwd-beta-0.0.1
          path: beta-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
