name: Build SOUNWD desktop apps

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "src/**"
      - "android/**"
      - "requirements.txt"
      - "bootstrap.py"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: SOUNWD-Windows
            output: SOUNWD.exe
          - os: ubuntu-22.04
            artifact: SOUNWD-Linux
            output: SOUNWD

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Deno for YouTube JavaScript challenges
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Set Deno executable path (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: 'DENO_PATH=$((Get-Command deno).Source)' >> $env:GITHUB_ENV

      - name: Set Deno executable path (Linux)
        if: runner.os == 'Linux'
        run: echo "DENO_PATH=$(command -v deno)" >> "$GITHUB_ENV"
      - name: Validate desktop Python syntax
        run: |
          python -m py_compile src/gui.py src/cli.py src/yt_dlp_support.py bootstrap.py
          python -m compileall -q android

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build standalone app (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: pyinstaller --noconfirm --clean --onefile --windowed --name SOUNWD --collect-all customtkinter --collect-all imageio_ffmpeg --collect-all yt_dlp --collect-all yt_dlp_ejs --add-binary "$env:DENO_PATH;." src/gui.py

      - name: Build standalone app (Linux)
        if: runner.os == 'Linux'
        run: pyinstaller --noconfirm --clean --onefile --windowed --name SOUNWD --collect-all customtkinter --collect-all imageio_ffmpeg --collect-all yt_dlp --collect-all yt_dlp_ejs --add-binary "$DENO_PATH:." src/gui.py

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.output }}
          if-no-files-found: error
