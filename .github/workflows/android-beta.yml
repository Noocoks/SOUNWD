name: SOUNWD Android Beta

on:
  push:
    branches: [beta/android-minimal-screen]
    paths:
      - 'app/**'
      - 'icon/**'
      - 'tools/generate_icons.py'
      - '.github/workflows/android-beta.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'icon/**'
      - 'tools/generate_icons.py'
      - '.github/workflows/android-beta.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install icon generator dependency
        run: python -m pip install Pillow
      - name: Generate and install Android icons
        shell: bash
        run: |
          set -euo pipefail
          python tools/generate_icons.py
          RES=app/src/main/res
          mkdir -p "$RES/drawable" "$RES/drawable-nodpi" "$RES/mipmap-anydpi-v26"
          cp assets/generated/android/drawable-nodpi/sounwd_master.png "$RES/drawable-nodpi/"
          cp assets/generated/android/drawable/sounwd_mark.png "$RES/drawable/"
          cp assets/generated/android/drawable/sounwd_launcher_foreground.png "$RES/drawable/"
          cp assets/generated/android/mipmap-anydpi-v26/ic_launcher.xml "$RES/mipmap-anydpi-v26/"
          rm -f "$RES/drawable/sounwd_mark.xml"
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "$RES/mipmap-$density"
            cp "assets/generated/android/mipmap-$density/ic_launcher.png" "$RES/mipmap-$density/"
          done
          test -s "$RES/drawable/sounwd_mark.png"
          test -s "$RES/drawable/sounwd_launcher_foreground.png"
          grep -q '@drawable/sounwd_launcher_foreground' "$RES/mipmap-anydpi-v26/ic_launcher.xml"
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build Android debug APK
        run: gradle assembleDebug
      - name: Verify APK was generated
        run: test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: sounwd-beta-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
