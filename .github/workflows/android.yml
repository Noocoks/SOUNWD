name: Build SOUNWD Android APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sounwd-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip build-essential autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev automake
          python -m pip install --upgrade pip
          python -m pip install buildozer==1.6.0 cython==0.29.34
      - name: Verify Android toolchain and local recipe
        working-directory: android
        run: |
          grep -E '^(requirements|p4a.branch|p4a.commit|p4a.local_recipes) *=' buildozer.spec
          test -f p4a-recipes/python3/__init__.py
          python -m py_compile p4a-recipes/python3/__init__.py
      - name: Build debug APK
        working-directory: android
        env:
          BUILDOZER_WARN_ON_ROOT: "0"
        run: buildozer -v android debug
      - name: Verify APK exists
        run: |
          test -n "$(find android/bin -maxdepth 1 -type f -name '*.apk' -print -quit)"
          ls -lh android/bin/*.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SOUNWD-Android-APK
          path: android/bin/*.apk
          if-no-files-found: error
          retention-days: 14
