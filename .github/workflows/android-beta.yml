name: SOUNWD Android Beta

on:
  push:
    branches: [beta/android-minimal-screen]
    paths:
      - 'beta-android/**'
      - 'icon/**'
      - 'tools/generate_icons.py'
      - '.github/workflows/android-beta.yml'
  pull_request:
    paths:
      - 'beta-android/**'
      - 'icon/**'
      - 'tools/generate_icons.py'
      - '.github/workflows/android-beta.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install icon generator dependency
        run: python -m pip install Pillow
      - name: Generate all SOUNWD icons from the master image
        run: python tools/generate_icons.py
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build Android debug APK
        working-directory: beta-android
        run: gradle assembleDebug
      - name: Verify APK was generated
        run: test -s beta-android/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: sounwd-beta-debug
          path: beta-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
