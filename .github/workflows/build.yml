name: Build SOUNWD desktop apps

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "src/**"
      - "android/**"
      - "requirements.txt"
      - "bootstrap.py"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: SOUNWD-Windows
            output: SOUNWD.exe
          - os: ubuntu-22.04
            artifact: SOUNWD-Linux
            output: SOUNWD

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Deno for YouTube JavaScript challenges
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Validate desktop Python syntax
        run: |
          python -m py_compile src/gui.py src/cli.py src/yt_dlp_support.py bootstrap.py
          python -m compileall -q android

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build standalone app with bundled Deno
        shell: bash
        run: |
          python -c "import os,shutil,subprocess; deno=shutil.which('deno'); assert deno, 'Deno executable not found'; sep=';' if os.name == 'nt' else ':'; subprocess.check_call(['pyinstaller','--noconfirm','--clean','--onefile','--windowed','--name','SOUNWD','--collect-all','customtkinter','--collect-all','imageio_ffmpeg','--collect-all','yt_dlp','--collect-all','yt_dlp_ejs','--add-binary',deno+sep+'.','src/gui.py'])"

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.output }}
          if-no-files-found: error
