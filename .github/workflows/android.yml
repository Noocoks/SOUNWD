name: Build SOUNWD Android APK

on:
  push:
    branches: [main, "android/**"]
    paths:
      - "android/**"
      - "assets/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - "assets/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sounwd-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip build-essential autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev automake
          python -m pip install --upgrade pip
          python -m pip install buildozer==1.6.0 cython==0.29.34 pillow pip-audit bandit yt-dlp==2026.10.26 androidstorage4kivy==0.1.1
      - name: Run security regression tests
        run: |
          python -m unittest discover -s tests -p 'test_security.py' -v
          python -m unittest discover -s tests -p 'test_android_security.py' -v
      - name: Audit Android build dependencies
        run: pip-audit --strict
      - name: Static security analysis
        run: bandit -r src android bootstrap.py -ll
      - name: Generate and verify shared brand assets
        run: |
          python assets/build_brand_assets.py
          python tests/test_brand_assets.py
      - name: Validate Android Python syntax
        working-directory: android
        run: python -m compileall -q .
      - name: Verify Android toolchain and local recipe
        working-directory: android
        run: |
          grep -E '^(requirements|p4a.branch|p4a.commit|p4a.local_recipes) *=' buildozer.spec
          test -f p4a-recipes/python3/__init__.py
          python -m py_compile p4a-recipes/python3/__init__.py sitecustomize.py main.py
      - name: Build debug APK
        working-directory: android
        env:
          BUILDOZER_WARN_ON_ROOT: "0"
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee ../android-build.log
      - name: Verify APK exists
        run: |
          test -n "$(find android/bin -maxdepth 1 -type f -name '*.apk' -print -quit)"
          ls -lh android/bin/*.apk
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: SOUNWD-Android-Build-Log
          path: android-build.log
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: SOUNWD-Android-APK
          path: android/bin/*.apk
          if-no-files-found: error
          retention-days: 14
