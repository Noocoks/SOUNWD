name: SOUNWD Android Kotlin Beta

on:
  push:
    branches: [beta/android-kotlin-minimal]
    paths:
      - "android-kotlin/**"
      - ".github/workflows/android-kotlin-beta.yml"
  pull_request:
    paths:
      - "android-kotlin/**"
      - ".github/workflows/android-kotlin-beta.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: android-kotlin
        run: gradle :app:assembleDebug --no-daemon

      - name: Verify APK alignment
        run: |
          APK="android-kotlin/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          SDK_ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -name zipalign -type f | sort -V | tail -n 1)"
          "$SDK_ZIPALIGN" -c -P 16 -v 4 "$APK"

      - name: Upload beta APK
        uses: actions/upload-artifact@v4
        with:
          name: sounwd-android-beta
          path: android-kotlin/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
