name: Build SOUNWD desktop apps

on:
  push:
    branches: [main, 'security/**']
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "SOUNWD.spec"
      - "assets/**"
      - "Linux/**"
      - "android/**"
      - "requirements.txt"
      - "bootstrap.py"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: SOUNWD-Windows
            output: SOUNWD.exe
          - os: ubuntu-22.04
            artifact: SOUNWD-Linux
            output: SOUNWD

    runs-on: ${{ matrix.os }}
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Set up Deno for YouTube JavaScript challenges
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x

      - name: Set Deno executable path (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "DENO_PATH=$((Get-Command deno).Source)" >> $env:GITHUB_ENV

      - name: Set Deno executable path (Linux)
        if: runner.os == 'Linux'
        run: echo "DENO_PATH=$(command -v deno)" >> "$GITHUB_ENV"

      - name: Validate desktop Python syntax
        run: |
          python -m py_compile src/gui.py src/cli.py src/yt_dlp_support.py bootstrap.py
          python -m compileall -q android

      - name: Install Linux virtual display for packaged-app smoke test
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip 'setuptools>=84.1.0'
          pip install --only-binary=:all: -r requirements.txt
          pip install pyinstaller==6.22.3 Pillow==13.0.0 pip-audit bandit

      - name: Run security regression tests
        run: |
          python -m unittest discover -s tests -p 'test_security.py' -v
          python -m unittest discover -s tests -p 'test_android_security.py' -v
      - name: Audit Python dependencies
        run: pip-audit --strict
      - name: Static security analysis
        run: bandit -r src android bootstrap.py -ll -s B404,B603,B607

      - name: Generate desktop icon and startup splash
        run: |
          python assets/build_brand_assets.py
          python tests/test_brand_assets.py
          python assets/generate_splash.py

      - name: Verify vertical centering (Windows)
        if: runner.os == 'Windows'
        run: python tests/smoke_gui_layout.py

      - name: Verify vertical centering (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a python tests/smoke_gui_layout.py

      - name: Build standalone app (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: pyinstaller --noconfirm --clean SOUNWD.spec

      - name: Build standalone app (Linux)
        if: runner.os == 'Linux'
        run: pyinstaller --noconfirm --clean SOUNWD.spec

      - name: Verify embedded Windows taskbar icons
        if: runner.os == 'Windows'
        run: python tests/smoke_windows_icon.py dist/SOUNWD.exe

      - name: Smoke-test packaged app startup (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python tests/smoke_packaged_startup.py dist/SOUNWD.exe

      - name: Smoke-test packaged app startup (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          xvfb-run -a python tests/smoke_packaged_startup.py dist/SOUNWD

      - name: Upload app
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.output }}
          if-no-files-found: error

  build-android:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/security/')
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip build-essential autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev automake
          python -m pip install --upgrade pip 'setuptools>=84.1.0'
          python -m pip install --only-binary=:all: buildozer==1.6.0 cython==0.29.34 Pillow==13.0.0 pip-audit bandit yt-dlp==2026.10.26
      - name: Run Android security regression tests
        run: |
          python -m unittest discover -s tests -p 'test_security.py' -v
          python -m unittest discover -s tests -p 'test_android_security.py' -v
      - name: Audit Android build dependencies
        run: pip-audit --strict
      - name: Static security analysis
        run: bandit -r src android bootstrap.py -ll -s B404,B603,B607
      - name: Generate and verify Android brand resources
        run: |
          python assets/build_brand_assets.py
          python tests/test_brand_assets.py
      - name: Validate Android Python and toolchain
        working-directory: android
        run: |
          python -m compileall -q .
          grep -E '^(requirements|p4a.branch|p4a.commit|p4a.local_recipes) *=' buildozer.spec
          test -f p4a-recipes/python3/__init__.py
          python -m py_compile p4a-recipes/python3/__init__.py sitecustomize.py main.py
      - name: Build Android debug APK
        working-directory: android
        env:
          BUILDOZER_WARN_ON_ROOT: "0"
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee ../android-build.log
      - name: Verify Android APK
        run: |
          test -n "$(find android/bin -maxdepth 1 -type f -name '*.apk' -print -quit)"
          ls -lh android/bin/*.apk
      - name: Inspect compiled Android APK manifest security
        run: |
          APK="$(find android/bin -maxdepth 1 -type f -name '*.apk' -print -quit)"
          python tests/check_apk_manifest.py "$APK"
      - name: Upload Android APK
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: SOUNWD-Android-PR
          path: android/bin/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload Android build log
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: SOUNWD-Android-PR-Build-Log
          path: android-build.log
          if-no-files-found: ignore
          retention-days: 14
