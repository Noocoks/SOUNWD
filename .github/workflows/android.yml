name: Build SOUNWD Android APK

on:
  push:
    branches: [main, "android/**", "security/**"]
    paths:
      - "android/**"
      - "beta-android/app/src/main/java/**"
      - "assets/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - "beta-android/app/src/main/java/**"
      - "assets/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sounwd-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip build-essential autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev automake
          python -m pip install --upgrade pip 'setuptools>=84.1.0'
          python -m pip install --only-binary=:all: buildozer==1.6.0 cython==0.29.34 Pillow==13.0.0 pip-audit bandit yt-dlp==2026.10.26
      - name: Run security regression tests
        run: |
          python -m unittest discover -s tests -p 'test_security.py' -v
          python -m unittest discover -s tests -p 'test_android_security.py' -v
      - name: Audit Android build dependencies
        run: pip-audit --strict
      - name: Static security analysis
        run: bandit -r src android bootstrap.py -ll -s B404,B603,B607
      - name: Generate and verify shared brand assets
        run: |
          python assets/build_brand_assets.py
          python tests/test_brand_assets.py
      - name: Validate Android Python syntax
        working-directory: android
        run: python -m compileall -q .
      - name: Verify Android toolchain and local recipe
        working-directory: android
        run: |
          grep -E '^(requirements|p4a.branch|p4a.commit|p4a.local_recipes) *=' buildozer.spec
          test -f p4a-recipes/python3/__init__.py
          python -m py_compile p4a-recipes/python3/__init__.py sitecustomize.py main.py
      - name: Build debug APK
        working-directory: android
        env:
          BUILDOZER_WARN_ON_ROOT: "0"
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee ../android-build.log
      - name: Verify APK exists
        run: |
          test -n "$(find android/bin -maxdepth 1 -type f -name '*.apk' -print -quit)"
          ls -lh android/bin/*.apk
      - name: Inspect compiled APK manifest security
        run: |
          APK="$(find android/bin -maxdepth 1 -type f -name '*.apk' -print -quit)"
          python tests/check_apk_manifest.py "$APK"
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: SOUNWD-Android-Build-Log
          path: android-build.log
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload APK
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: SOUNWD-Android-APK
          path: android/bin/*.apk
          if-no-files-found: error
          retention-days: 14
