name: Build SOUNWD desktop apps

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "SOUNWD.spec"
      - "assets/**"
      - "Linux/**"
      - "android/**"
      - "requirements.txt"
      - "bootstrap.py"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: SOUNWD-Windows
            output: SOUNWD.exe
          - os: ubuntu-22.04
            artifact: SOUNWD-Linux
            output: SOUNWD

    runs-on: ${{ matrix.os }}
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Set up Deno for YouTube JavaScript challenges
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Set Deno executable path (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "DENO_PATH=$((Get-Command deno).Source)" >> $env:GITHUB_ENV

      - name: Set Deno executable path (Linux)
        if: runner.os == 'Linux'
        run: echo "DENO_PATH=$(command -v deno)" >> "$GITHUB_ENV"

      - name: Validate desktop Python syntax
        run: |
          python -m py_compile src/gui.py src/cli.py src/yt_dlp_support.py bootstrap.py
          python -m compileall -q android

      - name: Install Linux virtual display for packaged-app smoke test
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow pip-audit
      - name: Audit desktop Python dependencies
        run: pip-audit --strict -r requirements.txt
      - name: Test downloader security boundaries
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p 'test_security_*.py' -v

      - name: Generate desktop icon and startup splash
        run: |
          python assets/build_brand_assets.py
          python tests/test_brand_assets.py
          python assets/generate_splash.py

      - name: Verify vertical centering (Windows)
        if: runner.os == 'Windows'
        run: python tests/smoke_gui_layout.py

      - name: Verify vertical centering (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a python tests/smoke_gui_layout.py

      - name: Build standalone app (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: pyinstaller --noconfirm --clean SOUNWD.spec

      - name: Build standalone app (Linux)
        if: runner.os == 'Linux'
        run: pyinstaller --noconfirm --clean SOUNWD.spec

      - name: Verify embedded Windows taskbar icons
        if: runner.os == 'Windows'
        run: python tests/smoke_windows_icon.py dist/SOUNWD.exe

      - name: Smoke-test packaged app startup (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python tests/smoke_packaged_startup.py dist/SOUNWD.exe

      - name: Smoke-test packaged app startup (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          xvfb-run -a python tests/smoke_packaged_startup.py dist/SOUNWD

      - name: Upload app
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.output }}
          if-no-files-found: error

  build-android-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip build-essential autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev automake
          python -m pip install --upgrade pip
          python -m pip install buildozer==1.6.0 cython==0.29.34 pillow
      - name: Generate and verify Android brand resources
        run: |
          python assets/build_brand_assets.py
          python tests/test_brand_assets.py
      - name: Validate Android Python and toolchain
        working-directory: android
        run: |
          python -m compileall -q .
          grep -E '^(requirements|p4a.branch|p4a.commit|p4a.local_recipes) *=' buildozer.spec
          test -f p4a-recipes/python3/__init__.py
          python -m py_compile p4a-recipes/python3/__init__.py sitecustomize.py main.py
      - name: Build Android debug APK
        working-directory: android
        env:
          BUILDOZER_WARN_ON_ROOT: "0"
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee ../android-build.log
      - name: Verify Android APK
        run: |
          test -n "$(find android/bin -maxdepth 1 -type f -name '*.apk' -print -quit)"
          ls -lh android/bin/*.apk
      - name: Upload Android APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: SOUNWD-Android-PR
          path: android/bin/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload Android build log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: SOUNWD-Android-PR-Build-Log
          path: android-build.log
          if-no-files-found: ignore
          retention-days: 14
