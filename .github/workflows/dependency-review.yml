name: SOUNWD Dependency Vulnerability Scan

on:
  pull_request:
    branches: [beta/android-minimal-screen]
  push:
    branches: [beta/android-minimal-screen]
  schedule:
    - cron: '41 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  security-events: write

jobs:
  osv-scan:
    name: OSV vulnerability scan (no Dependency Graph required)
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
    with:
      scan-args: |-
        --recursive
        ./
    permissions:
      contents: read
      actions: read
      security-events: write
