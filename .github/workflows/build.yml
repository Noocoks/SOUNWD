name: Build SOUNWD desktop apps

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "src/**"
      - "android/**"
      - "requirements.txt"
      - "bootstrap.py"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: SOUNWD-Windows
            output: SOUNWD.exe
          - os: ubuntu-22.04
            artifact: SOUNWD-Linux
            output: SOUNWD

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Deno for YouTube JavaScript challenges
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Set Deno executable path (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "DENO_PATH=$((Get-Command deno).Source)" >> $env:GITHUB_ENV

      - name: Set Deno executable path (Linux)
        if: runner.os == 'Linux'
        run: echo "DENO_PATH=$(command -v deno)" >> "$GITHUB_ENV"

      - name: Validate desktop Python syntax
        run: |
          python -m py_compile src/gui.py src/cli.py src/yt_dlp_support.py bootstrap.py
          python -m compileall -q android

      - name: Install Linux virtual display for packaged-app smoke test
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build standalone app (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: pyinstaller --noconfirm --clean --onefile --windowed --name SOUNWD --collect-all customtkinter --collect-all imageio_ffmpeg --collect-all yt_dlp --collect-all yt_dlp_ejs --paths src --hidden-import yt_dlp_support --add-binary "$env:DENO_PATH;." src/gui.py

      - name: Build standalone app (Linux)
        if: runner.os == 'Linux'
        run: pyinstaller --noconfirm --clean --onefile --windowed --name SOUNWD --collect-all customtkinter --collect-all imageio_ffmpeg --collect-all yt_dlp --collect-all yt_dlp_ejs --paths src --hidden-import yt_dlp_support --add-binary "$DENO_PATH:." src/gui.py

      - name: Smoke-test packaged app startup (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $app = Start-Process -FilePath "dist/SOUNWD.exe" -PassThru
          Start-Sleep -Seconds 10
          if ($app.HasExited) {
            throw "SOUNWD.exe exited during startup (exit code $($app.ExitCode))."
          }
          Stop-Process -Id $app.Id -Force

      - name: Smoke-test packaged app startup (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set +e
          timeout 12s xvfb-run -a ./dist/SOUNWD
          status=$?
          set -e
          if [ "$status" -ne 124 ]; then
            echo "SOUNWD exited during startup with status $status"
            exit 1
          fi

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.output }}
          if-no-files-found: error
